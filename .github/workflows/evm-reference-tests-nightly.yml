name: evm-reference-tests-nightly

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  evm-reference-full:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Initialize vcpkg submodule
        run: git submodule update --init --recursive -- vcpkg
      - uses: lukka/get-cmake@latest
        with:
          cmakeVersion: 3.28.3
          ninjaVersion: 1.12.1
      - name: Install linux dependencies
        run: |
          sudo apt update
          sudo apt install -y --no-install-recommends \
              wget python3-dev python3-pip git curl zip unzip tar \
              clang make build-essential libssl-dev zlib1g-dev ca-certificates mold autoconf \
              flex bison patch pkg-config uuid-runtime automake gcc-14 g++-14
      - uses: actions-rs/toolchain@v1
        with:
          toolchain: nightly-2024-02-25
          override: true
      - name: Configure and build evm-reference tests
        run: |
          CC=gcc-14 CXX=g++-14 cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DTESTS=ON \
            -DBCOS_EVM_REFERENCE_TESTS=ON \
            -DFULLNODE=ON \
            -DCOVERAGE=OFF \
            -DWITH_LIGHTNODE=ON \
            -DWITH_CPPSDK=ON \
            -DWITH_TIKV=OFF \
            -DWITH_WASM=OFF \
            -DWITH_TARS_SERVICES=OFF \
            -DTOOL=OFF \
            -DLINKER=mold \
            -DVCPKG_TARGET_TRIPLET=x64-linux-release \
            .
          cmake --build build --target EthGSTFull EthExecutionSpecStateTests EthExecutionSpecTransactionTests -j$(nproc)
      - name: Run full GST sweep
        run: |
          build/bcos-evm/evm-reference-tests/EthGSTFull \
            --ethereum-tests-root bcos-evm/evm-reference-tests/assets/ethereum-tests \
            --expectations bcos-evm/evm-reference-tests/manifests/expectations.json
      - name: Run EEST state full sweep
        run: |
          build/bcos-evm/evm-reference-tests/EthExecutionSpecStateTests \
            --manifest bcos-evm/evm-reference-tests/manifests/eth-eest-state-full.json \
            --eest-root bcos-evm/evm-reference-tests/assets/eest \
            --expectations bcos-evm/evm-reference-tests/manifests/expectations.json
      - name: Run EEST transaction full sweep
        run: |
          build/bcos-evm/evm-reference-tests/EthExecutionSpecTransactionTests \
            --manifest bcos-evm/evm-reference-tests/manifests/eth-eest-tx-full.json \
            --eest-root bcos-evm/evm-reference-tests/assets/eest
