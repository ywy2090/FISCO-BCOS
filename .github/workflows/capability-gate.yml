name: capability-gate

on:
  pull_request:
    paths:
      - 'bcos-evm/capability-matrix.md'
      - 'bcos-evm/eth/**'
      - 'bcos-evm/bcos/**'
      - 'bcos-evm/opstack/**'
      - 'bcos-evm/evm-reference-tests/**'
      - 'bcos-evm/test/eth/RevisionConfigProfileTest.cpp'
      - 'transaction-executor/**'

jobs:
  matrix-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint capability matrix tokens
        run: bash bcos-evm/tools/ci/check-capability-matrix.sh
      - name: Require matrix change when capability surfaces change
        run: |
          set -euo pipefail
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          changed=$(git diff --name-only "$base" "$head" || true)
          surfaces=$(echo "$changed" | rg -e '^bcos-evm/eth/' \
            -e '^bcos-evm/bcos/(ExecuteViaHost|FiscoPolicy)' \
            -e '^bcos-evm/opstack/OpStackExecuteViaHost' \
            -e '^transaction-executor/bcos-transaction-executor/.*(TxInputBuilder|Policy|TransactionExecutorImpl)' \
            || true)
          if [[ -n "$surfaces" ]]; then
            echo "$changed" | rg -q '^bcos-evm/capability-matrix\.md$' || {
              echo "error: capability surface changed but capability-matrix.md was not updated" >&2
              echo "$surfaces" >&2
              exit 1
            }
          fi
          if echo "$changed" | rg -q '^bcos-evm/eth/RevisionConfig\.h$'; then
            echo "$changed" | rg -q '^bcos-evm/test/eth/RevisionConfigProfileTest\.cpp$' || {
              echo "error: RevisionConfig.h changed but RevisionConfigProfileTest.cpp was not updated" >&2
              exit 1
            }
          fi

  opstack-ctest:
    needs: matrix-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Initialize vcpkg submodule
        run: git submodule update --init --recursive -- vcpkg
      - name: Compute vcpkg revision
        id: vcpkg-revision
        run: echo "revision=$(git -C vcpkg rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: lukka/get-cmake@latest
        with:
          cmakeVersion: 3.28.3
          ninjaVersion: 1.12.1
      - name: Restore vcpkg cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/build/vcpkg_installed
          key: vcpkg-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'ports/**') }}-${{ steps.vcpkg-revision.outputs.revision }}-ubuntu-latest-x64-cache-key-v4
      - name: Install linux dependencies
        run: |
          sudo apt update
          sudo apt install -y --no-install-recommends \
              wget python3-dev python3-pip git curl zip unzip tar \
              clang make build-essential libssl-dev zlib1g-dev ca-certificates mold autoconf \
              flex bison patch pkg-config uuid-runtime automake gcc-14 g++-14
      - uses: actions-rs/toolchain@v1
        with:
          toolchain: nightly-2024-02-25
          override: true
      - name: Configure and build opstack tests
        run: |
          CC=gcc-14 CXX=g++-14 cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DTESTS=ON \
            -DCOVERAGE=OFF \
            -DWITH_LIGHTNODE=ON \
            -DWITH_CPPSDK=ON \
            -DWITH_TIKV=OFF \
            -DWITH_WASM=OFF \
            -DWITH_TARS_SERVICES=OFF \
            -DTOOL=OFF \
            -DLINKER=mold \
            -DVCPKG_TARGET_TRIPLET=x64-linux-release \
            .
          cmake --build build --target test-opstack-transaction-executor-fixture -j$(nproc)
          cmake --build build/bcos-evm/test -j$(nproc)
      - name: Run opstack CTest
        run: |
          ctest -R 'OpStack|L1Block|Deposit|Blob|7702|RefundIsthmus|L1Attributes' \
            --test-dir build/bcos-evm/test -C Debug --output-on-failure
          ctest -R OpStackTransactionExecutorFixture \
            --test-dir build/transaction-executor/tests -C Debug --output-on-failure

  evm-reference-smoke:
    needs: matrix-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Initialize vcpkg submodule
        run: git submodule update --init --recursive -- vcpkg
      - uses: lukka/get-cmake@latest
        with:
          cmakeVersion: 3.28.3
          ninjaVersion: 1.12.1
      - name: Restore vcpkg cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/build/vcpkg_installed
          key: vcpkg-evm-ref-smoke-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}-ubuntu-latest
      - name: Install linux dependencies
        run: |
          sudo apt update
          sudo apt install -y --no-install-recommends \
              wget python3-dev python3-pip git curl zip unzip tar \
              clang make build-essential libssl-dev zlib1g-dev ca-certificates mold autoconf \
              flex bison patch pkg-config uuid-runtime automake gcc-14 g++-14
      - uses: actions-rs/toolchain@v1
        with:
          toolchain: nightly-2024-02-25
          override: true
      - name: Configure and build evm-reference smoke
        run: |
          CC=gcc-14 CXX=g++-14 cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DTESTS=ON \
            -DBCOS_EVM_REFERENCE_TESTS=ON \
            -DFULLNODE=ON \
            -DCOVERAGE=OFF \
            -DWITH_LIGHTNODE=ON \
            -DWITH_CPPSDK=ON \
            -DWITH_TIKV=OFF \
            -DWITH_WASM=OFF \
            -DWITH_TARS_SERVICES=OFF \
            -DTOOL=OFF \
            -DLINKER=mold \
            -DVCPKG_TARGET_TRIPLET=x64-linux-release \
            .
          cmake --build build --target EthGSTSmoke EthExecutionSpecStateTests EthExecutionSpecTransactionTests ManifestLint -j$(nproc)
      - name: Run evm-reference smoke tests
        run: |
          ctest -L evm-reference-tests-smoke --test-dir build -C Debug --output-on-failure
