name: specs-tests-nightly

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  specs-tests-full:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Initialize vcpkg submodule
        run: git submodule update --init --recursive -- vcpkg
      - uses: lukka/get-cmake@latest
        with:
          cmakeVersion: 3.28.3
          ninjaVersion: 1.12.1
      - name: Install linux dependencies
        run: |
          sudo apt update
          sudo apt install -y --no-install-recommends \
              wget python3-dev python3-pip git curl zip unzip tar \
              clang make build-essential libssl-dev zlib1g-dev ca-certificates mold autoconf \
              flex bison patch pkg-config uuid-runtime automake gcc-14 g++-14
      - uses: actions-rs/toolchain@v1
        with:
          toolchain: nightly-2024-02-25
          override: true
      - name: Configure and build specs-tests
        run: |
          CC=gcc-14 CXX=g++-14 cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DTESTS=ON \
            -DBCOS_EVM_SPECS_TESTS=ON \
            -DFULLNODE=ON \
            -DCOVERAGE=OFF \
            -DWITH_LIGHTNODE=ON \
            -DWITH_CPPSDK=ON \
            -DWITH_TIKV=OFF \
            -DWITH_WASM=OFF \
            -DWITH_TARS_SERVICES=OFF \
            -DTOOL=OFF \
            -DLINKER=mold \
            -DVCPKG_TARGET_TRIPLET=x64-linux-release \
            .
          cmake --build build --target EthGSTFull EthExecutionSpecStateTests EthExecutionSpecTransactionTests EthEestStateGranular -j$(nproc)
      - name: Run full GST sweep
        run: |
          build/bcos-evm/test/eth-eest-test/EthGSTFull \
            --ethereum-tests-root bcos-evm/test/eth-eest-test/assets/ethereum-tests \
            --expectations bcos-evm/test/eth-eest-test/manifests/expectations.json
      - name: Run EEST state full sweep
        run: |
          build/bcos-evm/test/eth-eest-test/EthExecutionSpecStateTests \
            --manifest bcos-evm/test/eth-eest-test/manifests/eth-eest-state-full.json \
            --eest-root bcos-evm/test/eth-eest-test/assets/eest \
            --expectations bcos-evm/test/eth-eest-test/manifests/expectations.json
      - name: Run EEST transaction full sweep
        run: |
          build/bcos-evm/test/eth-eest-test/EthExecutionSpecTransactionTests \
            --manifest bcos-evm/test/eth-eest-test/manifests/eth-eest-tx-full.json \
            --eest-root bcos-evm/test/eth-eest-test/assets/eest
      - name: Run EthEestStateGranular full tree (informational)
        continue-on-error: true
        run: |
          python3 bcos-evm/test/eth-eest-test/tools/scan-eest-failures.py \
            --granular-full --build-dir build
      - name: Upload granular full-tree reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eest-granular-full-reports
          path: |
            bcos-evm/test/eth-eest-test/reports/eest-granular-full-failures.json
            bcos-evm/test/eth-eest-test/reports/eest-granular-full-failures.md
            bcos-evm/test/eth-eest-test/reports/eest-granular-failures-*.json
            bcos-evm/test/eth-eest-test/reports/eest-granular-failures-*.md
            bcos-evm/test/eth-eest-test/reports/gtest-xml/granular_full.xml
          if-no-files-found: ignore
